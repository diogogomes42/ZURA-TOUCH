name: Android CI

on:
  push:
    branches: [main, master]
    paths:
      - "Prize wheel/android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "Prize wheel/android/**"
      - ".github/workflows/android-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Prize wheel/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        working-directory: .
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APKs
        run: ./gradlew :app-customer:assembleDebug :app-operator:assembleDebug --no-daemon

      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: app-customer-debug
          path: Prize wheel/android/app-customer/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload operator APK
        uses: actions/upload-artifact@v4
        with:
          name: app-operator-debug
          path: Prize wheel/android/app-operator/build/outputs/apk/debug/*.apk
          if-no-files-found: error
